name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test recovery tools with synthetic data
        run: python3 -m unittest discover -s tests -v
      - name: Check repository hygiene and evidence hashes
        run: python3 scripts/check_repo.py
      - name: Check original metrics script syntax
        run: bash -n scripts/original/system_metrics.sh
